name: Exploitability
on:
  push:
    branches: [main]
permissions:
  contents: read
  security-events: read
jobs:
  exploitability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assess open Code Scanning alerts
        uses: hackin2minutes-oss/hackin2minutes-oss-exploitability-action@v2
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          code-scanning-repo: ${{ github.repository }}
          code-scanning-ref: ${{ github.ref }}
          exposure: internet
          fail-on: confirmed_exploitable
